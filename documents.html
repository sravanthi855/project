<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TrustVault | My Documents</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body data-page="documents">
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand-wrap sidebar-brand">
          <div class="brand-mark" aria-label="TrustVault logo">T</div>
          <div>
            <p class="eyebrow">SECURE VAULT</p>
            <h1>TrustVault</h1>
          </div>
        </div>

        <nav class="sidebar-nav" aria-label="Main navigation">
          <a class="nav-item" href="dashboard.html"><span>Dashboard</span></a>
          <a class="nav-item active" href="documents.html"><span>My Documents</span></a>
          <a class="nav-item" href="shared.html"><span>Shared With Me</span></a>
          <a class="nav-item" href="permissions.html"><span>Permissions</span></a>
          <a class="nav-item" href="audit.html"><span>Audit History</span></a>
        </nav>

        <div class="sidebar-footer">
          <div class="user-pill">
            <span class="user-avatar">AS</span>
            <div>
              <strong>Aarav Sharma</strong>
              <small>Admin</small>
            </div>
          </div>
          <a class="nav-item logout-link" href="index.html">Logout</a>
        </div>
      </aside>

      <main class="main-panel">
        <header class="topbar">
          <button class="mobile-nav-toggle" aria-label="Open navigation">☰</button>
          <div>
            <p class="eyebrow text-accent">My Documents</p>
            <h2>Secure document library</h2>
          </div>
          <a href="upload.html" class="btn btn-primary">Upload Document</a>
        </header>

        <div class="page-content">
          <section class="card table-card no-pad">
            <div class="toolbar">
              <div class="toolbar-group search-group">
                <label class="sr-only" for="documentSearch">Search documents</label>
                <input id="documentSearch" type="search" placeholder="Search documents" />
              </div>

              <div class="toolbar-group">
                <label for="documentFilter">File type</label>
                <select id="documentFilter">
                  <option value="all">All</option>
                  <option value="PDF">PDF</option>
                  <option value="DOCX">DOCX</option>
                  <option value="XLSX">XLSX</option>
                  <option value="PNG">PNG</option>
                  <option value="JPG">JPG</option>
                  <option value="JPEG">JPEG</option>
                </select>
              </div>
            </div>

            <div class="table-wrap hidden">
              <table>
                <thead>
                  <tr>
                    <th>File name</th>
                    <th>Type</th>
                    <th>Uploaded</th>
                    <th>Status</th>
                    <th>Actions</th>
                  </tr>
                </thead>
                <tbody id="documentsTable"></tbody>
              </table>
            </div>

            <div id="documentsEmpty" class="empty-state" role="status" aria-live="polite">
              <h3>No documents found</h3>
              <p>Loading your documents…</p>
            </div>
          </section>
        </div>
      </main>
    </div>

    <div id="toastContainer" class="toast-container" aria-live="polite"></div>

    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
    <script src="js/documents.js"></script>
  </body>
</html>
